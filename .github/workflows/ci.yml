# Сборка и тесты на каждый push и pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Сборка
        run: dotnet build Roshiq.sln -c Release
      - name: Тесты
        run: dotnet test tests/Roshiq.Tests/Roshiq.Tests.csproj -c Release --no-build
